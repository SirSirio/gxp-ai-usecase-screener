# Builds the container image and pushes it to the GitHub container registry (ghcr.io), for Azure Container Apps
# (decision D27, docs/DEPLOYMENT.md). Run it by hand: Actions > "Build image" > Run workflow, or by pushing a tag v*.
name: Build image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sirsirio/gxp-ai-usecase-screener

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Can we use AI for this? A first check against EU GMP rules for medicine manufacturing.

      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8000:8000 -e GXP_PROVIDER=offline ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/api/assess -H "Content-Type: application/json" \
            -d '{"description":"A chatbot writes first drafts of cleaning SOPs; QA reviews and approves every SOP before use.","provider":"offline"}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['decision']['label']); assert r['decision']['verdict']"
          docker logs app | tail -20
