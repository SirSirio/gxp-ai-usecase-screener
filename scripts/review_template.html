<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GxP case review</title>
<link rel="icon" href="data:,">
<meta name="description" content="Review page for the labelled evaluation cases of the GxP AI use-case assistant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<!--
  Built by scripts/build_review_page.py, which injects the case data and the data hash.
  Design: Minimalism / Swiss style for trust-first internal tooling (dials: variance 3, motion 2, density 5).
  Tokens: one accent (deep green #17594A on a warm neutral base, mint green in dark mode; no blue), the same
  palette as the web app (app/static/style.css). Status and outcome tones are functional
  and always paired with text. Radius rule: 8px for panels, controls, buttons and tooltips; full pill
  for chips, status pills and the switch.
  Icons: Tabler Icons, outline set, v3.19.0 (MIT). Path data copied from @tabler/icons/icons/outline/*.svg.
-->
<style>
:root {
  color-scheme: light dark;
  --font-head: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-body: "Noto Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  --bg: #F4F3EE;
  --surface: #FCFCF9;
  --sunk: #ECEBE4;
  --text: #1E2321;
  --muted: #565D58;
  --border: #E1DFD6;
  --control: #858A83;
  --accent: #17594A;
  --accent-hover: #10463A;
  --on-accent: #FAFBF8;
  --accent-soft: #E4EEE8;
  --accent-text: #17594A;
  --focus: #17594A;
  --tip-bg: #26302B;
  --tip-text: #F4F3EE;

  --ok-text: #13773A;  --ok-bg: #E6F4EA;  --ok-bar: #279645;
  --warn-text: #855000; --warn-bg: #FAF0DC; --warn-bar: #C48A1E;
  --stop-text: #A3312A; --stop-bg: #F7EAE6; --stop-bar: #C0574B;
  --neutral-text: #4E5550; --neutral-bg: #ECEBE4; --neutral-bar: #9DA29B;

  --shadow-raised: 0 1px 2px rgb(30 35 33 / .06), 0 4px 12px rgb(30 35 33 / .06);
  --shadow-tip: 0 4px 16px rgb(30 35 33 / .18);

  --r: 8px;
  --r-pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --dur: 150ms;
  --ease: cubic-bezier(.2, 0, .2, 1);
  --header-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181D1A; --sunk: #1F2522; --text: #E5E8E2; --muted: #A6ADA5;
    --border: #2B322E; --control: #6C756E; --accent: #4CD4A2; --accent-hover: #74E0BA; --on-accent: #0B1A14;
    --accent-soft: #142F26; --accent-text: #70DDB4; --focus: #70DDB4; --tip-bg: #E5E8E2; --tip-text: #1E2321;
    --ok-text: #6FD982; --ok-bg: #12291A; --ok-bar: #2F9E52;
    --warn-text: #E9BC6A; --warn-bg: #2A2113; --warn-bar: #B8892F;
    --stop-text: #F2A497; --stop-bg: #2B1916; --stop-bar: #C0574B;
    --neutral-text: #C6CBC4; --neutral-bg: #1F2522; --neutral-bar: #6C756E;
    --shadow-raised: 0 1px 2px rgb(0 0 0 / .3), 0 4px 12px rgb(0 0 0 / .25);
    --shadow-tip: 0 4px 16px rgb(0 0 0 / .45);
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181D1A; --sunk: #1F2522; --text: #E5E8E2; --muted: #A6ADA5;
  --border: #2B322E; --control: #6C756E; --accent: #4CD4A2; --accent-hover: #74E0BA; --on-accent: #0B1A14;
  --accent-soft: #142F26; --accent-text: #70DDB4; --focus: #70DDB4; --tip-bg: #E5E8E2; --tip-text: #1E2321;
  --ok-text: #6FD982; --ok-bg: #12291A; --ok-bar: #2F9E52;
  --warn-text: #E9BC6A; --warn-bg: #2A2113; --warn-bar: #B8892F;
  --stop-text: #F2A497; --stop-bg: #2B1916; --stop-bar: #C0574B;
  --neutral-text: #C6CBC4; --neutral-bg: #1F2522; --neutral-bar: #6C756E;
  --shadow-raised: 0 1px 2px rgb(0 0 0 / .3), 0 4px 12px rgb(0 0 0 / .25);
  --shadow-tip: 0 4px 16px rgb(0 0 0 / .45);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.55 var(--font-body);
  min-height: 100dvh;
}
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 18px; height: 18px; flex: none; }
.muted { color: var(--muted); }
kbd {
  font: 500 12px/1 var(--font-body); padding: 3px 6px; border-radius: 4px;
  border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); color: var(--muted);
}
.skip { position: absolute; left: var(--s4); top: -60px; padding: var(--s2) var(--s3); background: var(--accent); color: var(--on-accent); border-radius: var(--r); z-index: 200; }
.skip:focus { top: var(--s2); }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 var(--s4); }

/* Header */
.top { background: var(--surface); border-bottom: 1px solid var(--border); z-index: 50; }
@media (min-width: 960px) {
  .top { position: sticky; top: 0; }
  html { scroll-padding-top: calc(var(--header-h) + 12px); }
}
.top-inner { display: grid; gap: var(--s3); padding-top: var(--s3); padding-bottom: var(--s3); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); justify-content: space-between; }
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.brand p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.saved.is-warn { color: var(--warn-text); }
.saved .ic { width: 16px; height: 16px; }
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); font-size: 14px; }
.progress-text strong { font-family: var(--font-head); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { display: flex; width: 140px; height: 6px; border-radius: var(--r-pill); overflow: hidden; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--border); }
.bar span { display: block; height: 100%; }
.bar .b-approved { background: var(--ok-bar); }
.bar .b-rewrite { background: var(--warn-bar); }
.bar .b-rejected { background: var(--stop-bar); }
.counts { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 13px; }
.counts li { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.counts .ic { width: 16px; height: 16px; }
.counts b { color: var(--text); font-weight: 600; }
.reviewer { display: flex; align-items: center; gap: var(--s2); font-size: 14px; }
.reviewer label { color: var(--muted); font-weight: 500; }
.reviewer input { width: 13rem; max-width: 100%; height: 36px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  height: 40px; padding: 0 var(--s4); border-radius: var(--r); white-space: nowrap;
  font: 600 14px/1 var(--font-head); border: 1px solid transparent;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--accent-text); border-color: var(--control); }
.btn-secondary:hover { background: var(--accent-soft); }
.linkbtn {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 2px; border: 0; background: none;
  color: var(--accent-text); font: 600 14px/1.3 var(--font-body); text-decoration: underline; text-underline-offset: 3px; border-radius: 4px;
}
.linkbtn .ic { width: 16px; height: 16px; }
@media (pointer: coarse) { .btn { height: 44px; } }

/* Inputs */
.input {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--control); border-radius: var(--r);
  background: var(--surface); color: var(--text); line-height: 1.45;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.input::placeholder { color: var(--muted); opacity: 1; }
.input:hover { border-color: var(--muted); }
.input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.input:disabled { opacity: .55; cursor: not-allowed; }
textarea.input { resize: vertical; field-sizing: content; min-height: 64px; }
textarea.input.one-line { min-height: 40px; }
.select { position: relative; display: block; }
.select select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer; }
.select .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
@media (pointer: coarse) { .input { min-height: 44px; font-size: 16px; } }

/* Toolbar */
.toolbar { padding-top: var(--s5); }
.filters { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); align-items: end; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl > label { font-size: 13px; font-weight: 500; color: var(--muted); }
.search { position: relative; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 36px; }
.toolbar-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s4); margin-top: var(--s3); min-height: 32px; }
.shown { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: var(--s3); }
.shown b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.kbd-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.kbd-hint .ic { width: 16px; height: 16px; }
.kbd-hint span { margin-right: 6px; }
@media (max-width: 960px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filters .ctl-search { grid-column: 1 / -1; } }
@media (max-width: 760px), (pointer: coarse) { .kbd-hint { display: none; } }

/* Notice */
.notice { display: flex; align-items: flex-start; gap: var(--s3); margin-top: var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); font-size: 14px; box-shadow: inset 3px 0 0 var(--neutral-bar); }
.notice.is-warn { background: var(--warn-bg); color: var(--warn-text); box-shadow: inset 3px 0 0 var(--warn-bar); border-color: transparent; }
.notice.is-ok { background: var(--ok-bg); color: var(--ok-text); box-shadow: inset 3px 0 0 var(--ok-bar); border-color: transparent; }
.notice p { flex: 1; padding-top: 2px; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border: 0; border-radius: var(--r-pill); background: transparent; color: inherit; }
.iconbtn:hover { background: var(--sunk); }

/* Case list */
.cases { list-style: none; margin: var(--s3) 0 var(--s7); padding: 0; display: grid; gap: var(--s2); }
.case { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); transition: box-shadow var(--dur) var(--ease); }
.case.is-open { box-shadow: var(--shadow-raised); }
.case-h { font: inherit; }
.case-toggle {
  display: grid; width: 100%; align-items: center; gap: var(--s4);
  grid-template-columns: 4.25rem minmax(0, 1fr) minmax(11rem, 17rem) 8.75rem 20px;
  padding: var(--s3) var(--s4); border: 0; background: none; text-align: left; border-radius: var(--r);
  transition: background-color var(--dur) var(--ease);
}
.case-toggle:hover { background: var(--sunk); }
.case.is-open .case-toggle { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 1px solid var(--border); }
.c-id { font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-main { display: grid; min-width: 0; gap: 1px; }
.c-title { font: 600 16px/1.35 var(--font-head); overflow-wrap: anywhere; }
.c-title.is-empty { color: var(--muted); font-style: italic; font-weight: 500; font-family: var(--font-body); }
.c-meta { font-size: 13px; color: var(--muted); }
.o-pill { display: block; padding: 2px 0 2px 10px; border-left: 3px solid var(--tone-bar, var(--neutral-bar)); font-size: 14px; line-height: 1.35; }
.o-pill small { display: block; font-size: 12px; color: var(--muted); }
.chev { color: var(--muted); transition: transform var(--dur) var(--ease); }
.case-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
@media (max-width: 760px) {
  .case-toggle { grid-template-columns: minmax(0, 1fr) auto 20px; grid-template-areas: "id status chev" "main main main" "outcome outcome outcome"; gap: var(--s2) var(--s3); }
  .c-id { grid-area: id; } .c-main { grid-area: main; } .c-outcome { grid-area: outcome; } .c-status { grid-area: status; } .case-toggle > .chev { grid-area: chev; }
}

/* Tones */
.tone-ok { --tone-text: var(--ok-text); --tone-bg: var(--ok-bg); --tone-bar: var(--ok-bar); }
.tone-warn { --tone-text: var(--warn-text); --tone-bg: var(--warn-bg); --tone-bar: var(--warn-bar); }
.tone-stop { --tone-text: var(--stop-text); --tone-bg: var(--stop-bg); --tone-bar: var(--stop-bar); }
.tone-neutral { --tone-text: var(--neutral-text); --tone-bg: var(--neutral-bg); --tone-bar: var(--neutral-bar); }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px; border-radius: var(--r-pill); font-size: 13px; font-weight: 500; line-height: 1.3; white-space: nowrap; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
.pill .ic { width: 16px; height: 16px; }
.pill.st-approved { color: var(--ok-text); background: var(--ok-bg); border-color: transparent; }
.pill.st-rewrite { color: var(--warn-text); background: var(--warn-bg); border-color: transparent; }
.pill.st-rejected { color: var(--stop-text); background: var(--stop-bg); border-color: transparent; }

/* Expanded body */
.case-body { padding: var(--s4); }
.body-grid { display: grid; gap: var(--s4); }
.body-grid .col { display: grid; gap: var(--s4); align-content: start; }
@media (min-width: 1024px) { .body-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
.sec { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
.sec-h { font-size: 15px; font-weight: 600; }
.sec-toggle { display: flex; align-items: center; gap: var(--s2); width: 100%; padding: var(--s3) var(--s4); border: 0; background: none; text-align: left; font: 600 15px/1.3 var(--font-head); border-radius: var(--r); }
.sec-toggle:hover { background: var(--sunk); }
.sec-toggle .chev { transform: rotate(-90deg); }
.sec-toggle[aria-expanded="true"] .chev { transform: rotate(0deg); }
.sec-count { margin-left: auto; font: 500 13px var(--font-body); color: var(--muted); }
.sec-body { padding: 0 var(--s4) var(--s4); }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: var(--r-pill); font: 500 12px/1.5 var(--font-body); white-space: nowrap; }
.tag .ic { width: 14px; height: 14px; }
.tag-edit { color: var(--accent-text); background: var(--accent-soft); }
.tag-edited { color: var(--accent-text); background: var(--accent-soft); }
.tag-warn { color: var(--warn-text); background: var(--warn-bg); }

/* Fields (section 1) */
.field { padding: var(--s3) 0 var(--s3) var(--s3); border-top: 1px solid var(--border); box-shadow: inset 3px 0 0 transparent; transition: box-shadow var(--dur) var(--ease); }
.sec-body > .field:first-child, .sec-body > .field.first { border-top: 0; }
.field.is-edited { box-shadow: inset 3px 0 0 var(--accent); }
.f-head, .f-legend { display: block; margin-bottom: 4px; line-height: 28px; }
.f-label { font-size: 14px; font-weight: 500; color: var(--muted); line-height: 1.45; }
.f-head .info, .f-legend .info { margin: -4px 0 -4px 2px; }
.f-head .tag, .f-legend .tag { margin-left: var(--s1); vertical-align: middle; }
fieldset.f-set { border: 0; margin: 0; padding: 0; min-width: 0; }
.f-legend { padding: 0; float: left; width: 100%; }
.f-legend + * { clear: both; }
.ans { overflow-wrap: anywhere; }
.ans-choice { display: inline-flex; align-items: center; gap: 2px; font-weight: 500; }
.na { color: var(--muted); font-style: italic; }
.explain { margin-top: 6px; padding-left: var(--s3); border-left: 2px solid var(--border); color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.sub-label { display: block; margin: var(--s2) 0 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
.row-inline { display: flex; align-items: center; gap: var(--s1); }
.row-inline .select { flex: 1; min-width: 0; }
.opt-info { flex: none; min-width: 28px; }
.field.is-contested .f-label { color: var(--warn-text); }

/* Info (i) */
.info { display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none; padding: 0; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--muted); cursor: help; vertical-align: middle; transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.info:hover, .info[data-active] { color: var(--accent-text); background: var(--accent-soft); }
.info .ic { width: 18px; height: 18px; }
.tooltip {
  position: absolute; z-index: 100; max-width: min(320px, calc(100vw - 16px)); padding: 10px 12px;
  background: var(--tip-bg); color: var(--tip-text); border-radius: var(--r); box-shadow: var(--shadow-tip);
  font-size: 14px; line-height: 1.5;
}

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 0; min-height: 32px; padding: 0 2px 0 12px; border-radius: var(--r-pill); background: var(--sunk); border: 1px solid var(--border); font-size: 14px; line-height: 1.3; max-width: 100%; }
.chip.no-info { padding-right: 12px; }
.chip-plain { min-height: 26px; padding: 0 10px; font-size: 13px; color: var(--muted); background: transparent; }
.chip-check { padding-left: 4px; background: var(--surface); border-color: var(--control); }
.chip-check label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 6px; cursor: pointer; }
.chip-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.chip-check:has(input:checked) { background: var(--accent-soft); border-color: var(--accent-text); }
.chip-check:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip-check input:focus-visible { outline: none; }

/* Expected (section 2) */
.scope-line { font-size: 14px; color: var(--muted); margin-bottom: var(--s3); }
.labels { display: grid; gap: var(--s2); grid-template-columns: repeat(3, minmax(0, 1fr)); }
.labels-edit { grid-template-columns: 1fr; }
.labels-edit .tile-edit { grid-template-columns: minmax(7rem, auto) minmax(0, 1fr); align-items: center; column-gap: var(--s3); }
.labels-edit .tile-edit .tag { grid-column: 2; }
@media (max-width: 560px) { .labels, .labels-edit .tile-edit { grid-template-columns: 1fr; } .labels-edit .tile-edit .tag { grid-column: auto; } }
.tile { display: grid; align-content: start; gap: 4px; padding: 10px 12px; border-radius: var(--r); background: var(--sunk); border: 1px solid transparent; min-width: 0; }
.tile .t-name { font-size: 13px; font-weight: 500; color: var(--muted); }
.tile .t-val { font-weight: 600; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.tile.is-contested { border-color: var(--warn-bar); background: var(--warn-bg); }
.tile.is-contested .t-name { color: var(--warn-text); }
.tile .tag { justify-self: start; }
.tile.is-edited { border-color: var(--accent-text); }
.tile-edit { background: transparent; border-color: var(--border); }
.switch-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.switch { appearance: none; -webkit-appearance: none; position: relative; width: 40px; height: 24px; margin: 0; flex: none; border-radius: var(--r-pill); background: var(--control); cursor: pointer; transition: background-color var(--dur) var(--ease); }

.o-was { display: block; font-size: 13px; margin-top: 2px; }
.o-note { margin-top: var(--s2); font-size: 13px; color: var(--muted); }
.flag { display: flex; gap: var(--s2); align-items: flex-start; margin-top: var(--s2); font-size: 14px; color: var(--warn-text); }
.flag .ic { margin-top: 2px; }
.block { margin-top: var(--s4); }
.block h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.block p { font-size: 15px; overflow-wrap: anywhere; }
.contested { display: flex; gap: var(--s2); align-items: flex-start; margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r); background: var(--warn-bg); color: var(--warn-text); font-size: 14px; }
.contested .ic { margin-top: 2px; }

<body>
<a class="skip" href="#cases">Skip to the cases</a>

<header class="top" id="top">
  <div class="wrap top-inner">
    <div class="top-row">
      <div class="brand">
        <h1>Evaluation case review</h1>
        <p id="built"></p>
      </div>
      <div class="actions">
        <span class="saved" id="saved"></span>

      </div>
    </div>
    <div class="top-row">

        <span class="bar" id="bar" aria-hidden="true"></span>
        <ul class="counts" id="counts" aria-label="Cases by review status"></ul>
      </div>
      <div class="reviewer">
        <label for="reviewer">Reviewer</label>
        <input id="reviewer" class="input" type="text" autocomplete="name" placeholder="Your name (optional)">

    </div>
  </div>
</header>

<main id="main" class="wrap">
  <section class="toolbar" aria-label="Filters">

        <label for="f-q">Search</label>
        <div class="search"><svg class="ic" aria-hidden="true"></svg><input id="f-q" class="input" type="search" placeholder="Title, description or case id" autocomplete="off"></div>
      </div>
      <div class="ctl"><label for="f-set">Set</label><div class="select"><select id="f-set" class="input"></select></div></div>
      <div class="ctl"><label for="f-status">Status</label><div class="select"><select id="f-status" class="input"></select></div></div>
      <div class="ctl"><label for="f-outcome">Outcome</label><div class="select"><select id="f-outcome" class="input"></select></div></div>
      <div class="ctl"><label for="f-category">Category</label><div class="select"><select id="f-category" class="input"></select></div></div>
    </div>
    <div class="toolbar-foot">
      <p class="shown"><span id="shown" aria-live="polite"></span><button type="button" class="linkbtn" id="clear-filters" hidden>Clear filters</button></p>
      <p class="kbd-hint" id="kbd-hint"></p>
    </div>
  </section>

  <div class="notice" id="notice" role="status" hidden><p id="notice-text"></p><button type="button" class="iconbtn" id="notice-close" aria-label="Dismiss message"></button></div>

  <ol class="cases" id="cases" aria-label="Evaluation cases"></ol>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="tooltip" id="tooltip" aria-hidden="true" hidden></div>
<div class="sr-only" id="sr-live" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>

function icon(name, cls) {

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Presentation constants (no rules here: outcomes come from DATA.outcomes, built from app/rules.py). */
const STATUS = {

  approved: { label: "Approved", verb: "Approve", icon: "circle-check", key: "A" },
  rewrite: { label: "Needs rewrite", verb: "Needs rewrite", icon: "pencil", key: "R" },
  rejected: { label: "Rejected", verb: "Reject", icon: "circle-x", key: "X" }

const STATUS_ORDER = ["open", "approved", "rewrite", "rejected"];
const LABEL_FIELDS = [["gmp_relevance", "GMP relevance"], ["model_type", "Model type"], ["autonomy", "Autonomy"]];

const TONE = { permitted_with_hitl: "ok", permitted_risk_based: "ok", annex22_full: "ok", not_permitted_critical: "stop", hitl_required: "stop", needs_more_information: "warn" };

const cases = DATA && Array.isArray(DATA.cases) ? DATA.cases : [];
const QUESTIONS = DATA && Array.isArray(DATA.questions) ? DATA.questions : [];
const ui = cases.map(() => ({ open: false, secs: { form: true, expected: true, review: true } }));
const F = { q: "", set: "", status: "", outcome: "", category: "" };
let storageOK = true;
let lastCaseIdx = -1;

/* ---------- State ---------- */
let state = { reviewer: "", decisions: {}, dirty: false, exported_at: null };
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);

      const s = JSON.parse(raw);

  } catch (e) { storageOK = false; }
}

  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOK = true; } catch (e) { storageOK = false; }
  renderSaved();
}
let saveTimer = null;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 300); }
function touch(soon) { state.dirty = true; if (soon) { saveSoon(); renderSaved(); } else saveState(); }

const EMPTY_DEC = Object.freeze({ status: "open", comment: "", edited_form: {}, edited_expected: {} });
function dec(id) { return state.decisions[id] || EMPTY_DEC; }
function ensureDec(id) {
  let d = state.decisions[id];
  if (!d) d = state.decisions[id] = { status: "open", comment: "", edited_form: {}, edited_expected: {} };
  d.edited_form = d.edited_form || {};
  d.edited_expected = d.edited_expected || {};
  return d;
}
function pruneDec(id) {
  const d = state.decisions[id];
  if (d && (d.status || "open") === "open" && !d.comment && !Object.keys(d.edited_form || {}).length && !Object.keys(d.edited_expected || {}).length) delete state.decisions[id];
}
const isEditing = c => dec(c.id).status === "rewrite";

/* ---------- Effective values ---------- */
const qById = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const opt = (q, v) => (q.options || []).find(o => o.value === v);
function norm(q, v) {
  if (!q) return JSON.stringify(v == null ? null : v);
  if (q.type === "multi") return JSON.stringify((Array.isArray(v) ? v.slice() : []).sort());
  if (q.type === "single") return JSON.stringify({ c: (v && v.choice) || null, e: (v && v.explain) || "" });

}
function effForm(c) {
  const base = c.form || {};
  return isEditing(c) ? Object.assign({}, base, dec(c.id).edited_form || {}) : base;
}
function rawExpected(c) {
  const b = c.expected || {};
  const m = { in_scope: b.in_scope !== false, gmp_relevance: b.gmp_relevance || null, model_type: b.model_type || null, autonomy: b.autonomy || null };

  const base = { in_scope: b.in_scope !== false, gmp_relevance: b.gmp_relevance || null, model_type: b.model_type || null, autonomy: b.autonomy || null };

const verdictLabel = code => code ? ((DATA.verdict_labels || {})[code] || code) : "";

const toneOf = code => TONE[code] || "neutral";
function sourceLabel(s) {
  const doc = (DATA.doc_names || {})[s.doc] || s.doc;
  const title = (DATA.section_titles || {})[s.doc + "|" + s.section] || "";

  const b = e.target.closest && e.target.closest(".info");
  if (b && e.pointerType === "mouse") showTip(b, false);
});

  const b = e.target.closest && e.target.closest(".info");
  if (!b || e.pointerType !== "mouse") return;

  const b = e.target.closest && e.target.closest(".info");

/* ---------- Rendering: header ---------- */
function renderHeader() {
  $("built").textContent = DATA ? ("Built " + DATA.built_at + ". Form " + DATA.form_version + ". " + cases.length + " cases.") : "No data in this file.";

  $("bar").innerHTML = ["approved", "rewrite", "rejected"].map(s => '<span class="b-' + s + '" style="width:' + (total ? (n[s] / total * 100) : 0) + '%"></span>').join("");

function renderSaved() {
  const el = $("saved");
  let html, warn = false;

}

/* ---------- Export / import ---------- */
function localDate() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function buildExport() {
  const decisions = {};
  for (const c of cases) {
    const d = state.decisions[c.id];
    if (!d || !STATUS[d.status] || d.status === "open") continue;
    const out = { status: d.status, comment: d.comment || "", edited_form: {}, edited_expected: {} };
    if (d.status === "rewrite") {
      out.edited_form = Object.assign({}, d.edited_form || {});
      const diff = expectedDiff(c);
      if (Object.keys(diff).length) out.edited_expected = Object.assign({}, diff, { verdict: effExpected(c).verdict });
    }
    decisions[c.id] = out;
  }
  return { exported_at: new Date().toISOString(), data_hash: DATA_HASH, form_version: DATA.form_version, reviewer: (state.reviewer || "").trim(), decisions };
}
function exportDecisions() {
  saveState();
  const obj = buildExport();
  const name = "review_decisions_" + localDate() + ".json";
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  state.dirty = false; state.exported_at = obj.exported_at; saveState();
  const n = Object.keys(obj.decisions).length;
  notify("Exported " + n + (n === 1 ? " decision" : " decisions") + " to " + name + ". Open cases are not included.", "ok");
}
function importDecisions(obj) {
  if (!obj || typeof obj !== "object" || !obj.decisions || typeof obj.decisions !== "object") { notify("This file is not a decisions export. Nothing was imported.", "warn"); return; }
  const ids = new Set(cases.map(c => c.id));
  let n = 0, skipped = 0;
  for (const [id, dd] of Object.entries(obj.decisions)) {
    if (!ids.has(id) || !dd || !STATUS[dd.status]) { skipped++; continue; }
    const ee = Object.assign({}, dd.edited_expected || {}); delete ee.verdict;
    state.decisions[id] = { status: dd.status, comment: dd.comment || "", edited_form: Object.assign({}, dd.edited_form || {}), edited_expected: ee };
    n++;
  }
  if (obj.reviewer && !state.reviewer) { state.reviewer = obj.reviewer; $("reviewer").value = obj.reviewer; }
  touch(false);
  cases.forEach((c, i) => { updateRow(i); if (ui[i].open) renderBody(i); });
  renderProgress(); applyFilters();
  let msg = "Imported " + n + (n === 1 ? " decision" : " decisions") + (skipped ? ", skipped " + skipped + " with unknown case ids" : "") + ".";
  let tone = "ok";
  if (obj.data_hash && obj.data_hash !== DATA_HASH) { msg += " The file comes from a different data version (" + obj.data_hash + ", this page is " + DATA_HASH + "). Check the imported cases, their content may have changed."; tone = "warn"; }
  notify(msg, tone);
}
function notify(msg, tone) {
  const n = $("notice");
  n.className = "notice" + (tone === "warn" ? " is-warn" : tone === "ok" ? " is-ok" : "");
  $("notice-text").textContent = msg;
  n.hidden = false;
}

/* ---------- Keyboard navigation ---------- */
function visibleIdx() { return cases.map((c, i) => i).filter(i => !$("case-" + i).hidden); }
function caseOf(el) { const li = el && el.closest ? el.closest(".case") : null; return li ? +li.dataset.idx : -1; }
function move(dir) {
  const vis = visibleIdx(); if (!vis.length) return;
  let cur = caseOf(document.activeElement); if (cur < 0) cur = lastCaseIdx;
  let pos = vis.indexOf(cur);
  pos = pos < 0 ? (dir > 0 ? 0 : vis.length - 1) : Math.max(0, Math.min(vis.length - 1, pos + dir));
  const btn = $("case-" + vis[pos] + "-btn");
  btn.focus(); btn.scrollIntoView({ block: "nearest" });
}

/* ---------- Wiring ---------- */
function init() {
  loadState();
  renderHeader();
  if (!DATA || !cases.length) {
    $("export-btn").disabled = true; $("import-btn").disabled = true;
    $("progress-text").textContent = "No cases";
    document.querySelector(".toolbar").hidden = true;
    const e = $("empty");
    e.innerHTML = '<p class="empty-title">This page has no case data</p><p>Build it with scripts/build_review_page.py, then open review/review_cases.html.</p>';
    e.hidden = false; renderSaved();
    return;
  }
  renderFilters(); renderRows(); renderProgress(); applyFilters(); renderSaved();

  const top = $("top");
  const setH = () => document.documentElement.style.setProperty("--header-h", top.offsetHeight + "px");
  setH(); if (window.ResizeObserver) new ResizeObserver(setH).observe(top);

  let qTimer = null;
  $("f-q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { F.q = e.target.value.trim().toLowerCase(); applyFilters(); }, 120); });
  [["f-set", "set"], ["f-status", "status"], ["f-outcome", "outcome"], ["f-category", "category"]].forEach(([id, k]) => $(id).addEventListener("change", e => { F[k] = e.target.value; applyFilters(); }));
  $("clear-filters").addEventListener("click", clearFilters);
  $("empty").addEventListener("click", e => { if (e.target.closest("[data-clear-filters]")) clearFilters(); });
  $("reviewer").addEventListener("input", e => { state.reviewer = e.target.value; touch(true); });
  $("export-btn").addEventListener("click", exportDecisions);
  $("import-btn").addEventListener("click", () => $("import-file").click());
  $("import-file").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { importDecisions(JSON.parse(await f.text())); } catch (err) { notify("Could not read " + f.name + ": it is not valid JSON. Nothing was imported.", "warn"); }
    e.target.value = "";
  });
  $("notice-close").addEventListener("click", () => { $("notice").hidden = true; });

  const list = $("cases");
  list.addEventListener("focusin", e => { const i = caseOf(e.target); if (i >= 0) lastCaseIdx = i; });
  list.addEventListener("click", e => {
    const t = e.target;
    const infoBtn = t.closest(".info");
    if (infoBtn) { e.preventDefault(); if (tipOwner === infoBtn && tipPinned) hideTip(); else showTip(infoBtn, true); return; }
    const i = caseOf(t); if (i < 0) return;
    if (t.closest(".case-toggle")) { setExpanded(i, !ui[i].open); return; }
    const sec = t.closest("[data-sec-toggle]");
    if (sec) {
      const key = sec.dataset.secToggle, open = sec.getAttribute("aria-expanded") !== "true";
      ui[i].secs[key] = open; sec.setAttribute("aria-expanded", String(open));
      $("s-" + i + "-" + key).hidden = !open; return;
    }
    const sb = t.closest("[data-status-btn]"); if (sb) { setStatus(i, sb.dataset.statusBtn); return; }
    if (t.closest("[data-status-reset]")) { setStatus(i, "open"); return; }
    if (t.closest("[data-reset]")) resetEdits(i);
  });
  list.addEventListener("input", e => {
    const t = e.target, i = caseOf(t); if (i < 0) return;
    const body = $("case-" + i + "-body"), c = cases[i];
    if (t.matches("[data-comment]")) { const d = ensureDec(c.id); d.comment = t.value; pruneDec(c.id); touch(true); return; }
    if (t.matches("[data-form-key]")) { setFormValue(i, t.dataset.formKey, t.value); return; }
    if (t.matches("[data-explain-key]")) { setFormValue(i, t.dataset.explainKey, currentSingle(body, t.dataset.explainKey)); return; }
  });
  list.addEventListener("change", e => {
    const t = e.target, i = caseOf(t); if (i < 0) return;
    const body = $("case-" + i + "-body");
    if (t.matches("[data-choice-key]")) {
      const key = t.dataset.choiceKey, q = qById[key], o = opt(q, t.value);
      const slot = t.closest(".field").querySelector("[data-opt-info]");
      if (slot) { if (tipOwner && slot.contains(tipOwner)) hideTip(); slot.innerHTML = o ? info(o.help, o.label) : ""; }
      setFormValue(i, key, currentSingle(body, key)); return;
    }
    if (t.matches("[data-multi-key]")) {
      const key = t.dataset.multiKey, q = qById[key];
      const checked = [...body.querySelectorAll('[data-multi-key="' + CSS.escape(key) + '"]:checked')].map(x => x.value);
      const order = (q.options || []).map(o => o.value);
      checked.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
      setFormValue(i, key, checked); return;
    }
    if (t.matches("[data-label-key]")) { setExpectedValue(i, t.dataset.labelKey, t.value || null); return; }
    if (t.matches("[data-inscope]")) {
      body.querySelectorAll("[data-label-key]").forEach(s => s.disabled = !t.checked);
      const txt = body.querySelector("[data-inscope-text]"); if (txt) txt.textContent = t.checked ? "Yes" : "No";
      setExpectedValue(i, "in_scope", t.checked); return;
    }
  });

  document.addEventListener("click", e => { if (tipPinned && !e.target.closest(".info") && !tipEl.contains(e.target)) hideTip(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !tipEl.hidden) { hideTip(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    const t = e.target;
    if (t && t.closest && t.closest("input, textarea, select, [contenteditable='true']")) return;
    const k = e.key.toLowerCase();
    if (k === "j" || k === "k") { e.preventDefault(); move(k === "j" ? 1 : -1); return; }
    const map = { a: "approved", r: "rewrite", x: "rejected" };
    if (map[k]) { const i = caseOf(t); if (i < 0) return; e.preventDefault(); setStatus(i, map[k]); }
  });
  window.addEventListener("beforeunload", e => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });
}
init();
</script>
</body>
</html>
